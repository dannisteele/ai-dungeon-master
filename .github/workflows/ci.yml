name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    # Installs and runs the game the way windows/setup.ps1 and start.ps1 do on a player's
    # laptop: newest LTS Node, npm.cmd ci --ignore-scripts, Windows PowerShell 5.1.
    name: Windows install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install like setup.ps1
        shell: powershell
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { exit 1 }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Windows scripts (PowerShell 5.1)
        shell: powershell
        run: .github\scripts\windows-check.ps1
