name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    # Installs and runs the game the way windows/setup.ps1 and start.ps1 do on a player's
    # laptop: newest LTS Node, npm.cmd ci --ignore-scripts, Windows PowerShell 5.1.
    name: Windows install
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # windows-check.ps1 clones it to test a real update
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install like setup.ps1
        shell: powershell
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund; if ($LASTEXITCODE -ne 0) { exit 1 }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Windows scripts (PowerShell 5.1)
        shell: powershell
        run: .github\scripts\windows-check.ps1

  release:
    # Every push to main that adds a feature or fix becomes a new version: tagged, with a
    # GitHub release whose notes list the merged PRs. See scripts/release/.
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/release/run.ts
        env:
          GH_TOKEN: ${{ github.token }}
